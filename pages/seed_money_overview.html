<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seed Money Overview - Bank Nkhonde">
  <meta name="theme-color" content="#0A1628">
  <title>Seed Money Overview - Bank Nkhonde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="../styles/admin-layout.css">
  <link rel="stylesheet" href="../styles/pages.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <style>
    /* Touch target + keyboard focus for the tab control (shared .tab class has no focus-visible state);
       scoped locally here rather than raising the shared rule so other already-audited pages aren't affected. */
    .content-section-header .tabs .tab {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }

    .content-section-header .tabs .tab:focus-visible {
      outline: 2px solid var(--bn-accent);
      outline-offset: 2px;
    }

    /* Details column (folded live-penalty note, seed_money_overview_sql.js's
       createSeedMoneyRow) — cap width so it doesn't dominate the row, same
       treatment as manage_loans.html's #loansTable Details column. */
    #seedMoneyTable th:nth-child(8),
    #seedMoneyTable td:nth-child(8) {
      max-width: 260px;
      white-space: normal;
      word-break: break-word;
    }

    /* Progress bar cell — capped at desktop so the bar doesn't stretch to the
       column's natural width; min-width is kept unconditionally (including
       the mobile-card view) so it doesn't collapse to 0 width as a shrunk
       flex item, same treatment as manage_loans.html's #loansTable
       .loan-progress. */
    #seedMoneyTable td[data-label="Progress"] .progress-bar {
      max-width: 160px;
      min-width: 100px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      #seedMoneyTable td[data-label="Progress"] .progress-bar {
        max-width: none;
        margin: 0;
      }
    }

    .table-empty-cell {
      text-align: center;
      padding: var(--bn-space-4);
      color: var(--bn-gray);
    }
  </style>
</head>
<body data-nav-variant="admin" data-nav-active-page="seed-money" data-nav-page-title="Seed Money">
  <!-- Sidebar, topbar, and mobile nav injected by nav_sql.js -->
  <main class="main-content" id="mainContent">
    <div class="dashboard-content">

      <div class="page-group-selector">
        <select id="groupSelector">
          <option value="">Select a group...</option>
        </select>
      </div>

      <div class="page-stats">
        <div class="page-stat">
          <div class="page-stat-value success" id="totalCollected">MWK 0</div>
          <div class="page-stat-label">Collected</div>
        </div>
        <div class="page-stat">
          <div class="page-stat-value warning" id="pendingAmount">MWK 0</div>
          <div class="page-stat-label">Pending</div>
        </div>
        <div class="page-stat">
          <div class="page-stat-value" id="paidCount">0</div>
          <div class="page-stat-label">Paid</div>
        </div>
        <div class="page-stat">
          <div class="page-stat-value danger" id="unpaidCount">0</div>
          <div class="page-stat-label">Unpaid</div>
        </div>
      </div>

    <!-- Seed Money List -->
    <section class="content-section">
      <div class="content-section-header">
        <h2 class="content-section-title">Member Status</h2>
        <div class="tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="paid">Paid</button>
          <button class="tab" data-filter="pending">Pending</button>
        </div>
      </div>
      <div class="table-container">
        <table class="table table-responsive" id="seedMoneyTable">
          <thead>
            <tr>
              <th>Member</th>
              <th>Status</th>
              <th class="cell-right">Required</th>
              <th class="cell-right">Paid</th>
              <th class="cell-right">Outstanding</th>
              <th>Due Date</th>
              <th>Progress</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="seedMoneyList">
            <tr>
              <td colspan="8" class="table-empty-cell">Select a group to view seed money status</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    </div>
  </main>



  <!-- Loading Overlay -->
  <div class="spinner-overlay hidden" id="spinner">
    <div class="spinner-content">
      <div class="spinner"></div>
      <p class="loading-text">Loading seed money data...</p>
    </div>
  </div>

  <script type="module" src="../scripts/page-bootstrap.js?v=20260722"></script>
  <script type="module" src="../scripts/seed_money_overview_sql.js?v=20260722"></script>
</body>
</html>
