<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Messages - Bank Nkhonde">
  <meta name="theme-color" content="#0A1628">
  <title>Messages - Bank Nkhonde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="../styles/pages.css">
  <link rel="stylesheet" href="../styles/admin-layout.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <style>
    /* Messages page-specific overrides — base styles live in design-system.css */
    #messagesList > .spinner {
      align-self: center;
      width: 32px;
      height: 32px;
      border: 3px solid var(--bn-gray-lighter);
      border-top-color: var(--bn-accent);
      margin: var(--bn-space-6) auto var(--bn-space-3);
    }

    #messagesList > .loading-text {
      align-self: center;
      color: var(--bn-gray);
      text-align: center;
      margin: 0 0 var(--bn-space-6);
    }

    @media (prefers-reduced-motion: reduce) {
      #messagesList > .spinner {
        animation: bn-coin-pulse 1.8s ease-in-out infinite;
      }
    }

    .content-section-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--bn-space-2);
    }

    .message-header-actions {
      display: flex;
      gap: var(--bn-space-2);
      align-items: center;
    }

    .action-tabs-mb {
      margin-bottom: var(--bn-space-4);
    }

    .page-intro {
      margin-bottom: var(--bn-space-6);
    }

    .page-intro .page-subtitle {
      color: var(--bn-gray);
      font-weight: 500;
      margin-top: 0;
    }
  </style>
</head>
<body class="user-page" data-nav-variant="user-sidebar" data-nav-active-page="messages">
  <!-- Page Content -->
  <main class="main-content" id="mainContent">
   <div class="dashboard-content">
    <!-- Page intro: relocated group selector (was in the removed .page-header) -->
    <div class="page-intro">
      <p class="page-subtitle">Your notifications and broadcasts</p>
      <div class="page-group-selector">
        <select id="groupSelector">
          <option value="">All Groups</option>
        </select>
      </div>
    </div>
    <!-- Loading Overlay -->
    <div class="spinner-overlay hidden" id="spinner">
      <div class="spinner-content">
        <div class="spinner"></div>
        <p class="loading-text">Loading messages...</p>
      </div>
    </div>
    <section class="content-section">
      <div class="content-section-header content-section-header-flex">
        <h2 class="content-section-title">Your Messages</h2>
        <div class="message-header-actions">
          <button class="btn btn-ghost btn-sm" id="showReadBtn" style="display: none;">Show Read</button>
          <button class="btn btn-ghost btn-sm" id="markAllReadBtn" style="display: none;">Mark All as Read</button>
        </div>
      </div>

      <!-- Message Type Filters -->
      <div class="action-tabs action-tabs-mb">
        <button class="action-tab active" data-filter="all">All</button>
        <button class="action-tab" data-filter="unread">Unread</button>
        <button class="action-tab" data-filter="read">Read</button>
        <button class="action-tab" data-filter="loan">Loans</button>
        <button class="action-tab" data-filter="payment">Payments</button>
        <button class="action-tab" data-filter="seed_money">Seed Money</button>
        <button class="action-tab" data-filter="monthly">Monthly</button>
        <button class="action-tab" data-filter="loan_booking">Loan Booking</button>
        <button class="action-tab" data-filter="other">Other</button>
      </div>
      <div class="content-section-body">
        <div class="messages-list" id="messagesList">
          <div class="spinner"></div>
          <p class="loading-text">Loading messages…</p>
        </div>
      </div>
    </section>
   </div>
  </main>

  <!-- Message Modal -->
  <div class="message-modal" id="messageModal">
    <div class="message-modal-content">
      <div class="message-modal-header">
        <h3 class="message-modal-title" id="modalTitle">Message</h3>
        <button class="message-modal-close" id="closeModal" aria-label="Close message">&times;</button>
      </div>
      <div class="message-modal-body">
        <div class="message-modal-meta" id="modalMeta"></div>
        <div class="message-modal-text" id="modalText"></div>
        <div id="modalActions"></div>
      </div>
    </div>
  </div>

  <script type="module" src="../scripts/page-bootstrap.js?v=20260722"></script>
  <script type="module" src="../scripts/messages_sql.js?v=20260722"></script>
</body>
</html>
